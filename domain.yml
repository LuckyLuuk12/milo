version: "3.1"

slots:
  # Study-related stress
  study_event:
    type: text
    mappings:
      - type: from_llm

  study_deadline:
    type: text
    mappings:
      - type: from_llm

  study_preparation:
    type: text
    mappings:
      - type: from_llm

  study_difficulties:
    type: text
    mappings:
      - type: from_llm

  # General stress without an identifiable cause
  stress_feeling:
    type: text
    mappings:
      - type: from_llm

  immediate_needs:
    type: text
    mappings:
      - type: from_llm

  # Stress about a specific non-study-related situation
  stressor:
    type: text
    mappings:
      - type: from_llm

  stressor_timing:
    type: text
    mappings:
      - type: from_llm

  desired_outcome:
    type: text
    mappings:
      - type: from_llm

  

responses:
  # Study-related stress: collection questions
  utter_ask_study_event:
    - text: "What study-related task is worrying you? For example, an exam, an assignment, homework, or a project deadline."

  utter_ask_study_deadline:
    - text: "When is it due, or how much time do you have left?"

  utter_ask_study_preparation:
    - text: "What have you already done to prepare or make progress?"

  utter_ask_study_difficulties:
    - text: "Which parts are you finding most difficult, or which parts are you least confident about?"

  # General stress: collection questions
  utter_ask_stress_feeling:
    - text: "Can you describe how you're feeling right now? It's okay if you can't quite explain it."

  utter_ask_immediate_needs:
    - text: "Would you prefer to talk through what's going on, try something to help you settle, or work out a practical next step?"

  # Specific non-study-related stress: collection questions
  utter_ask_stressor:
    - text: "What situation or event outside your studies is worrying you?"

  utter_ask_stressor_timing:
    - text: "Is this happening now, or is there a particular time when it's going to happen?"

  utter_ask_desired_outcome:
    - text: "What are you most worried might happen, or what would you like to change about the situation?"

  # General small talk
  utter_free_chitchat_response:
    - text: "I'm here to help. What's on your mind?"
      metadata:
        rephrase: true
        rephrase_prompt: |
          You are Milo, a supportive assistant helping users manage
          study-related stress, general discomfort, and worries about
          specific life situations.

          Respond naturally to small talk while remaining friendly,
          calm, respectful, and concise. Do not force the conversation
          back to stress or studying when the user simply wants to chat.

          Never enforce the user to stay calm or "just chill". Avoid 
          using generic phrases like "I understand" or "I hear you". Instead, respond
          with empathy and understanding, and ask questions to clarify.

          Do not claim to be a therapist or diagnose the user.
          Do not invent personal experiences or claim to have feelings.

          Use the conversation history and current message to respond
          appropriately.

          Conversation history:
          {{history}}

          Current user message:
          {{current_input}}

          Suggested response:

  # General fallback
  utter_ask_rephrase:
    - text: "I'm not sure I understood that. Could you explain what you mean in another way?"

actions:
  - action_recommend_study_next_step
  - action_recommend_general_support
  - action_recommend_stressor_next_step