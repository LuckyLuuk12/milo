version: "3.1"

slots:
  study_event:
    type: text
    mappings:
      - type: from_llm

  study_deadline:
    type: text
    mappings:
      - type: from_llm

  study_preparation:
    type: text
    mappings:
      - type: from_llm

  study_difficulties:
    type: text
    mappings:
      - type: from_llm

  stress_feeling:
    type: text
    mappings:
      - type: from_llm

  immediate_needs:
    type: text
    mappings:
      - type: from_llm

  stressor:
    type: text
    mappings:
      - type: from_llm

  stressor_timing:
    type: text
    mappings:
      - type: from_llm

  desired_outcome:
    type: text
    mappings:
      - type: from_llm

responses:
  utter_ask_study_event:
    - text: "What study task is stressing you out? For example, an exam, assignment, or project."
      metadata:
        rephrase: false

  utter_ask_study_deadline:
    - text: "When is it due? An estimate is fine, and it's okay if you don't know."
      metadata:
        rephrase: false

  utter_ask_study_difficulties:
    - text: "What have you tried so far, and what feels hardest? 'All of it' is a valid answer."
      metadata:
        rephrase: false

  utter_ask_stress_feeling:
    - text: "What does the stress feel like right now? A few words are enough."
      metadata:
        rephrase: false

  utter_ask_immediate_needs:
    - text: "What would help most right now?"
      buttons:
        - title: "Talk it through"
          payload: "I want to talk it through."
        - title: "Help me settle"
          payload: "I want help settling down."
        - title: "Find a next step"
          payload: "I want one practical next step."
        - title: "I'm not sure"
          payload: "I'm not sure. You choose."
      metadata:
        rephrase: false

  utter_ask_stressor:
    - text: "What's happening outside your studies that's worrying you?"
      metadata:
        rephrase: false

  utter_ask_stressor_timing:
    - text: "When is this happening? An estimate or 'I'm not sure' is fine."
      metadata:
        rephrase: false

  utter_ask_desired_outcome:
    - text: "What's the main thing you're worried about, or what would you like to happen?"
      metadata:
        rephrase: false

  utter_free_chitchat_response:
    - text: "I'm here. What's on your mind?"
      metadata:
        rephrase: true
        rephrase_prompt: |
          You are Milo, a concise student stress-support assistant.
          Reply naturally to genuine small talk or unrelated social messages.
          Keep the response to one or two short sentences.
          Do not force the user back to studying or stress.
          Do not use generic phrases such as "I understand" or "I hear you".
          Do not claim to be human, a therapist, or to have personal feelings.
          If the user is asking what your previous question meant, explain
          that question plainly using the recent conversation. Do not simply
          repeat it word for word.
          If the user is answering the active question with uncertainty,
          frustration, or a broad answer, treat it as an answer rather than
          chitchat.

          Conversation history:
          {{history}}

          Current user message:
          {{current_input}}

          Suggested response:

  utter_crisis_support:
    - text: |
        I'm sorry things feel this difficult. You deserve support from a real person right now.

        - If you or someone else is in immediate danger, call 112.
        - In the Netherlands, 113 Suicide Prevention is available 24/7 at 113 or 0800-0113, or via chat at https://www.113.nl.

        I'm a chatbot and cannot provide emergency care. Please contact 113 or someone you trust now.
      metadata:
        rephrase: false

  utter_crisis_follow_up:
    - text: "Are you safe right now, and is there someone nearby you can contact?"
      metadata:
        rephrase: false

  utter_ask_continue_interrupted_flow_confirmation:
    - text: "Would you like to return to {{context.interrupted_flow_options}}?"
      buttons:
        - title: "Yes, continue"
          payload: "Yes, continue with the interrupted conversation."
        - title: "No, not now"
          payload: "No, don't continue with the interrupted conversation."
      metadata:
        rephrase: false
        template: jinja

  utter_ask_interrupted_flow_to_continue:
    - text: "Would you like to resume {{context.interrupted_flow_options}}?"
      buttons:
        - title: "Resume"
          payload: "Yes, resume the interrupted flow."
        - title: "Not now"
          payload: "No, not now."
      metadata:
        rephrase: false
        template: jinja

  utter_flow_cancelled_rasa:
    - text: "Okay, we'll leave {{ context.canceled_name | replace('_', ' ') }} for now."
      metadata:
        rephrase: false
        template: jinja

  utter_ask_continue_conversation:
    - text: "Did that help, or would you like to work on something else?"
      buttons:
        - title: "That helped"
          payload: "That helped, thanks."
        - title: "Something else"
          payload: "I'd like help with something else."
        - title: "I'm done"
          payload: "I'm done for now."
      metadata:
        rephrase: false

  utter_internal_error_response:
    - text: "I couldn't complete that just now. You can try again, or tell me what you need in a different way."
      metadata:
        rephrase: false

  utter_human_handoff_not_available:
    - text: "I can't connect you to a live person from this chat. You can contact your student counsellor, study advisor, GP, or someone you trust. If you're in immediate danger, call 112."
      metadata:
        rephrase: false

  utter_ask_rephrase:
    - text: "I didn't quite understand. Could you say that another way? A short answer is fine."
      metadata:
        rephrase: false
